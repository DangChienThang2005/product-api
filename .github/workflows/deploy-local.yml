name: Deploy Product API to Local Docker

on:
  workflow_run:
    workflows: ["Product API CD"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on:
      - self-hosted
      - Windows
      - X64

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Pull latest image from Docker Hub
        run: docker pull dangchienthang2005/product-api:latest

      - name: Stop old containers
        run: docker compose -f docker-compose-prod.yaml down

      - name: Start production containers
        run: docker compose -f docker-compose-prod.yaml up -d

      - name: Wait for containers
        shell: powershell
        run: Start-Sleep -Seconds 15

      - name: Check containers
        run: docker compose -f docker-compose-prod.yaml ps

      - name: Healthcheck Product API
        shell: powershell
        run: |
          $response = Invoke-RestMethod -Uri "http://localhost:3000/health"
          Write-Host "API status: $($response.status)"

          if ($response.status -ne "OK") {
            throw "Product API healthcheck failed"
          }