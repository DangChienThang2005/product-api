name: Product API CI Production Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-product-api:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PORT: 3000
      MONGO_URI: mongodb://localhost:27017/productdb

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Start Product API
        run: |
          node server.js &
          sleep 5

      - name: Test Health API
        run: |
          curl --fail http://localhost:3000/health

      - name: Test CREATE Product
        run: |
          curl --fail -X POST http://localhost:3000/api/products \
          -H "Content-Type: application/json" \
          -d '{"pid":"P001","pname":"Laptop","price":15000000,"quantity":10}'

      - name: Test READ All Products
        run: |
          curl --fail http://localhost:3000/api/products

      - name: Test READ Product P001
        run: |
          curl --fail http://localhost:3000/api/products/P001

      - name: Test UPDATE Product P001
        run: |
          curl --fail -X PUT http://localhost:3000/api/products/P001 \
          -H "Content-Type: application/json" \
          -d '{"pname":"Laptop Gaming","price":20000000,"quantity":5}'

      - name: Test DELETE Product P001
        run: |
          curl --fail -X DELETE http://localhost:3000/api/products/P001

      - name: Verify Product Deleted
        run: |
          RESPONSE=$(curl -s http://localhost:3000/api/products/P001)
          echo "$RESPONSE"
          echo "$RESPONSE" | grep "Product not found"

      - name: Test Docker Build
        run: docker build -t product-api .