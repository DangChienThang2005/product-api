services:
  mongodb:
    image: mongo:latest
    container_name: nammongodb-prod
    ports:
      - "27017:27017"
    volumes:
      - mongodb_prod_data:/data/db
    networks:
      - product-prod-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  product-api:
    image: dangchienthang2005/product-api:latest
    container_name: product-api-prod
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/productdb
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - product-prod-network

volumes:
  mongodb_prod_data:

networks:
  product-prod-network: